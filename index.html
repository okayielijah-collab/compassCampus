<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Compass Campus</title><style>
:root{--bg:#eaf6f1;--card:#fff;--ink:#17323a;--mute:#566e76;--pri:#0f7b8a;--ok:#1f9d55;--bad:#d64545;--line:#d5e5e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1f24;--card:#172b32;--ink:#e8f3f1;--mute:#9bb3b9;--pri:#4fc3d1;--line:#2a4249}}
:root[data-theme=dark]{--bg:#0f1f24;--card:#172b32;--ink:#e8f3f1;--mute:#9bb3b9;--pri:#4fc3d1;--line:#2a4249}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.3rem;margin:.3em 0}small,.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.bld:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:44px;font-weight:600}
.btn.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.link{background:none;border:0;color:var(--pri);padding:10px 0;min-height:44px;font-weight:600}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;min-height:56px}
.row span{display:flex;flex-direction:column}.row .ic{font-size:1.6rem}
.mapwrap{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#bfe8d4}svg{display:block;width:100%;height:auto}
.bld{cursor:pointer}.bld:hover .ring,.bld:focus .ring{fill:rgba(255,255,255,.45)}.ring{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12);opacity:.6}}.bld.soon{opacity:.8}
.flag{animation:wave 2s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
.cloud{animation:drift 30s linear infinite}.bob{animation:bob 3s ease-in-out infinite}
@keyframes wave{50%{transform:scaleX(.8)}}@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(440px)}}@keyframes bob{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.flag,.cloud,.bob,.ring{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:44px;background:var(--card)}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-of-type{border-top:0}
select,input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:6px}
textarea{min-height:170px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.fb{margin-top:6px;font-size:.95rem}
.line{display:block;width:100%;text-align:left;padding:12px;border:2px solid var(--line);border-radius:12px;margin:6px 0;background:var(--card);min-height:44px}
.line.on{border-color:var(--bad);background:rgba(214,69,69,.12)}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.note{font-size:.88rem;color:var(--mute);border-left:4px solid #f5a623;padding-left:10px;margin:14px 0}
.tag{font-size:.75rem;background:var(--line);border-radius:6px;padding:2px 8px}
pre{white-space:pre-wrap;font:inherit;margin:6px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.nav button{flex:1;background:none;border:0;border-radius:12px;min-height:52px;font-size:.75rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}.nav button b{font-size:1.2rem}.nav .on{color:var(--pri);font-weight:700;background:var(--bg)}.row:disabled{opacity:.7;cursor:default}
.sat{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:#f5a623;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:8;color:#17323a}.satp{position:fixed;left:8px;right:8px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-height:55vh;overflow:auto;margin:0 auto;max-width:620px;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style></head><body><main id="app"></main><script>
const KEY='compass_campus_v1',$=s=>document.querySelector(s);
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!DB||!DB.p)DB=DB&&(DB.name||DB.done)?{cur:'p1',p:{p1:DB}}:{cur:'',p:{}};
let S=DB.p[DB.cur]||{};
const fix=()=>{S.name=S.name||'';S.disc=S.disc||[];S.done=S.done||{}};fix();
const save=()=>{try{if(DB.cur)DB.p[DB.cur]=S;localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Spaces. "sponsor" is a future hook for sponsored spaces/challenges; it never touches TASKS scoring. */
const SPACES=[
{id:'career',name:'Career Discovery Centre',icon:'🧭',x:180,y:150,h:60,c:['#5eead4','#2bb5a6','#1b8f86'],live:1,desc:'Find your transferable skills',sponsor:null},
{id:'office',name:'Virtual Office',icon:'💼',x:95,y:275,h:44,c:['#93c5fd','#5a97e6','#3c74c4'],live:1,desc:'Try a virtual assistant job',sponsor:null},
{id:'lab',name:'Digital Skills Lab',icon:'🔬',x:265,y:275,h:44,c:['#d8b4fe','#a97be8','#8657c8'],desc:'CRM, marketing, AI tools, automation',sponsor:null},
{id:'studio',name:'Freelance Studio',icon:'🎨',x:100,y:410,h:44,c:['#fdba74','#f08c3c','#cc6c20'],desc:'Proposals, clients, portfolios',sponsor:null},
{id:'progress',name:'Progress Centre',icon:'🏆',x:260,y:415,h:44,c:['#86efac','#46c26f','#2a9a52'],live:1,desc:'Your skills and portfolio',sponsor:null}];
const SKILLS=[['admin','Office or admin work'],['customer','Dealing with customers'],['teaching','Teaching or training'],['writing','Writing or editing'],['numbers','Working with numbers'],['organising','Planning and organising'],['events','Running events'],['design','Design or visual work'],['tech','Comfortable with apps and tech']];
const PATHS=[
{n:'Virtual Assistant',t:['admin','organising','writing','customer'],d:'Manage inboxes, calendars and records for busy clients.'},
{n:'Customer Support Agent',t:['customer','writing','teaching'],d:'Help customers by email or chat for an online business.'},
{n:'Social Media and Content Support',t:['writing','design','tech'],d:'Draft and schedule posts for small brands.'},
{n:'Bookkeeping Assistant',t:['numbers','admin'],d:'Track invoices and expenses for small businesses.'},
{n:'Online Tutor',t:['teaching','writing'],d:'Teach what you know through live or recorded lessons.'},
{n:'Project Coordinator',t:['organising','events','admin'],d:'Keep remote teams and deadlines on track.'},
{n:'CRM and Automation Assistant',t:['tech','numbers','organising'],d:'Keep customer data tidy and set up simple automations.'}];
const TASKS=[
{id:'cal',title:'Organise the weekly calendar',skill:'Calendar management',type:'sel',
brief:'Your client is Maya Okoro, who runs a small bakery (fictional). She is in the kitchen every morning until 08:30. The staff standup must be on Monday morning. The supplier only takes calls after 14:00, and Maya travels on Thursdays. The accountant is only free on Wednesday morning. Choose a slot for each meeting.',
opts:['Mon 09:00','Mon 15:00','Tue 15:00','Wed 10:00','Thu 15:00'],
items:[{q:'Staff standup',ok:['Mon 09:00'],why:'Standups must be Monday morning, and Maya is free after 08:30.'},
{q:'Supplier call',ok:['Mon 15:00','Tue 15:00'],why:'The supplier only calls after 14:00 and Maya is away on Thursday, so Mon or Tue 15:00 fit.'},
{q:'Accountant review',ok:['Wed 10:00'],why:'The accountant is only free Wednesday morning.'}]},
{id:'mail',title:'Prioritise incoming emails',skill:'Email prioritisation',type:'sel',
brief:'Maya has five new emails. Decide what needs action now, what can wait until this week, and what can be archived.',
opts:['Do now','This week','Archive'],
items:[{q:'Hosting company: "Payment failed, your bakery website goes offline tomorrow"',ok:['Do now'],why:'A deadline within 24 hours with real impact comes first.'},
{q:'Flour supplier: "Delivery moved to Friday, please confirm by end of day"',ok:['Do now'],why:'It needs an answer today, so it cannot wait.'},
{q:'Customer: "Can I get a quote for a wedding cake in June?"',ok:['This week'],why:'It is a valuable lead, but June is months away. Reply within a few days.'},
{q:'Accountant: "Invoice attached, due in 14 days"',ok:['This week'],why:'Important, but the due date is two weeks away. Schedule it.'},
{q:'Newsletter: "10 tips to grow on Instagram"',ok:['Archive'],why:'No action needed. Archive to keep the inbox clear.'}]},
{id:'data',title:'Organise customer records',skill:'Data accuracy',type:'sel',
brief:'Review this fictional customer list before it is imported into a CRM. Mark each row as OK, a Duplicate of an earlier row, or Missing info.',
opts:['OK','Duplicate','Missing info'],
items:[{q:'1. Ada Eze | ada@mail.test | 0801 000 1111',ok:['OK'],why:'Complete, and the first time this person appears.'},
{q:'2. Ada Eze | ada@mail.test | 0801 000 1111',ok:['Duplicate'],why:'Identical to row 1. Remove it so Ada is not emailed twice.'},
{q:'3. Tom Reyes | (no email) | 0802 000 2222',ok:['Missing info'],why:'There is no email address, so he cannot be added to email campaigns.'},
{q:'4. Lina Park | lina@mail.test | 0803 000 3333',ok:['OK'],why:'Complete and unique so far.'},
{q:'5. L. Park | lina@mail.test | 0803 000 3333',ok:['Duplicate'],why:'Same email and phone as row 4. A shortened name does not make a new customer.'},
{q:'6. Sam Cole | sam@mail.test | 0804 000 4444',ok:['OK'],why:'Complete and unique.'}]},
{id:'mailreply',title:'Draft a professional client response',skill:'Client communication',type:'draft',
brief:'A customer, Jordan Bell, emailed: "My daughter\'s birthday cake arrived an hour late and the party had already started. I am very disappointed." Write a reply on behalf of Maya (about 40 to 150 words). You may offer a small refund or credit, but do not make promises Maya cannot control.'},
{id:'fix',title:'Find mistakes in a work schedule',skill:'Attention to detail',type:'flag',
brief:'Notes: Maya travels on Thursdays. The accountant is only free Wednesday morning. Staff standup is Monday 09:00 to 09:15. Tap every line that has a mistake, then check your work.',
items:[{q:'Mon 09:00-09:15 Staff standup',err:0,why:'Correct.'},
{q:'Mon 09:10-09:40 Supplier call',err:1,why:'Overlaps with the standup (09:10 is before 09:15). Move it to the afternoon.'},
{q:'Tue 11:00-12:00 Cake tasting with client',err:0,why:'No conflicts. Fine as is.'},
{q:'Wed 14:00-15:00 Accountant review',err:1,why:'The accountant is only free Wednesday morning.'},
{q:'Thu 10:00-11:00 In-person client meeting',err:1,why:'Maya is travelling on Thursdays.'},
{q:'Fri 16:00-16:30 Weekly wrap-up',err:0,why:'No conflicts. Fine as is.'}]}];
const DRAFT_CHECKS=[
['Greets Jordan by name',t=>/jordan/i.test(t)],
['Apologises',t=>/sorry|apolog/i.test(t)],
['Mentions the specific problem (late delivery or birthday)',t=>/late|delay|birthday/i.test(t)],
['Offers a concrete remedy (refund, credit, voucher, discount)',t=>/refund|credit|voucher|discount|replacement/i.test(t)],
['Gives a clear next step',t=>/by |within|tomorrow|today|please reply|let me know|reach out|contact/i.test(t)],
['Signs off politely',t=>/(regards|sincerely|best wishes|kind regards|thank you|thanks)[\s\S]{0,40}$/i.test(t)],
['Avoids over-promising (no "guarantee" or "never again")',t=>!/guarantee|100%|never happen again/i.test(t)],
['Right length (40 to 150 words)',t=>{const n=t.trim().split(/\s+/).filter(Boolean).length;return n>=40&&n<=150}]];
let view='map',soonId='',T={};
function go(v){const sp=SPACES.find(x=>x.id===v);if(sp&&!sp.live){soonId=v;v='soon'}view=v;render();scrollTo(0,0)}
function render(){stop3d();const t=TASKS.find(x=>x.id===view);$('#app').innerHTML=bar()+(view==='map'?'':'<button class="link" onclick="go(\''+(t?(t.sc?'biz':'office'):'map')+'\')">← '+(t?(t.sc?'Business School':'Virtual Office'):'Campus map')+'</button>')+(t?task(t):({map,career,office,progress,soon,schools,biz,home,'3d':v3d}[view])())+nav()+sbag();if(view==='3d')start3d()}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const person=(c,sk='#f1c9a5',hr='#3b2a20')=>`<ellipse cy="1" rx="6" ry="2" fill="#000" opacity=".15"/><rect x="-5" y="-15" width="10" height="14" rx="4" fill="${c}"/><circle cy="-20" r="5.5" fill="${sk}"/><path d="M-5.5 -20a5.5 5.5 0 0 1 11 0z" fill="${hr}"/>`;
const deskScene=()=>`<svg viewBox="0 0 320 100" role="img" aria-label="Classroom with you and three classmates" style="border-radius:16px;margin:8px 0;background:#e7f0fb"><rect y="78" width="320" height="22" fill="#c9d8ee"/><rect x="60" y="6" width="200" height="22" rx="4" fill="#fff" stroke="#c9d8ee"/><text x="160" y="21" text-anchor="middle" font-size="10" fill="#17323a">Next: ${(TASKS.find(t=>!t.sc&&!S.done[t.id])||TASKS[4]).title}</text>${[[(S.name||'You').slice(0,8)+' (you)',AV().c,45,AV().sk,AV().hr],['Chidi','#ef4444',125,'#f1c9a5','#3b2a20'],['Amara','#3b82f6',205,'#8d5a3b','#111'],['Tunde','#a855f7',285,'#c68642','#111']].map(([n,c,x,sk,hr],i)=>`<g transform="translate(${x} 70)"><g class="bob">${person(c,sk,hr)}</g></g><rect x="${x-26}" y="62" width="52" height="8" rx="3" fill="#8a5a2b"/><text x="${x}" y="92" text-anchor="middle" font-size="10.5" fill="#17323a">${n}</text>`).join('')}</svg>`;
const DEF={c:'#3b82f6',sk:'#c68642',hr:'#111'},AV=()=>({...DEF,...S.av});
const PEOPLE=[{n:'Chidi',g:'Virtual assistant',off:1},{n:'Amara',g:'Customer support',off:0},{n:'Tunde',g:'Bookkeeping assistant',off:-1},{n:'Grace',g:'Online tutor',cl:'Career Discovery Centre',sk:'Mapping transferable skills'},{n:'Ife',g:'Project coordinator',cl:'Career Discovery Centre',sk:'Planning and organising'}];
const SW={c:[['Blue','#3b82f6'],['Red','#ef4444'],['Green','#10b981'],['Orange','#f59e0b'],['Purple','#a855f7'],['Pink','#ec4899']],sk:[['Light','#f1c9a5'],['Tan','#c68642'],['Brown','#8d5a3b'],['Deep','#5a3825']],hr:[['Black','#111'],['Brown','#3b2a20'],['Auburn','#7a3b1a'],['Blonde','#d9a441']]};
const swatch=(k,L)=>`<div class="chips" style="margin:6px 0"><small style="width:44px">${L}</small>${SW[k].map(([n,v])=>`<button class="chip" style="padding:0;width:44px;justify-content:center;background:${v};border:3px solid ${AV()[k]===v?'#f5a623':'var(--line)'}" aria-label="${L} ${n}" onclick="av('${k}','${v}')"></button>`).join('')}</div>`;
const avCard=()=>{const a=AV();return `<div class="card"><b>Your avatar</b><div class="chips" style="margin:8px 0" role="group" aria-label="Preset characters">${PRESETS.map((q,i)=>`<button class="chip" onclick="pre(${i})"><svg viewBox="-12 -30 24 36" width="22" height="33" aria-hidden="true">${person(q.c,q.sk,q.hr)}</svg>${q.n}</button>`).join('')}</div><div style="display:flex;gap:12px;align-items:center"><svg viewBox="-12 -30 24 36" width="56" height="84" aria-hidden="true">${person(a.c,a.sk,a.hr)}</svg><div style="flex:1">${swatch('c','Shirt')}${swatch('sk','Skin')}${swatch('hr','Hair')}</div></div></div>`};
const meCard=()=>{const a=AV();return `<div class="card" style="display:flex;gap:12px;align-items:center"><svg viewBox="-12 -30 24 36" width="56" height="84" aria-hidden="true">${person(a.c,a.sk,a.hr)}</svg><div><b>${esc(S.name||'Learner')}</b> <span class="tag">Your profile</span><br><small>${Object.keys(S.done).length} of ${TASKS.length} tasks completed</small></div></div>`};
function av(k,v){S.av={...AV(),[k]:v};save();render()}
function who(i){const p=PEOPLE[i];$('#pc').innerHTML=`<div class="card"><b>${p.n}</b> <span class="tag">Learner profile</span><p>Goal: ${p.g}<br>Now attending: ${act(p).cl}<br>Practising: ${act(p).sk}</p><small>Fictional learner shown for illustration.</small></div>`}
let lg=0;
const PC={Chidi:['#ef4444','#f1c9a5','#3b2a20'],Amara:['#3b82f6','#8d5a3b','#111'],Tunde:['#a855f7','#c68642','#111'],Grace:['#f59e0b','#f1c9a5','#7a3b1a'],Ife:['#10b981','#8d5a3b','#111'],Guide:['#0f7b8a','#c68642','#111']};
const ROOMS={career:{b:'Skills map',n:['Grace','Ife','Guide']},office:{b:'Task board',n:['Chidi','Amara','Tunde']},progress:{b:'Progress wall',n:['Guide']},lab:{b:'Coming soon',n:['Guide']},studio:{b:'Coming soon',n:['Guide']}};
const SPOTS=[[120,138],[190,118],[245,148]];
function room(id){const R=ROOMS[id],s=SPACES.find(x=>x.id===id),a=AV();return `<svg viewBox="0 0 360 230" role="img" aria-label="Inside the ${s.name}" style="border-radius:16px;margin:8px 0;background:#dff3ee"><polygon points="25,150 180,80 180,20 25,90" fill="${s.c[1]}"/><polygon points="180,80 335,150 335,90 180,20" fill="${s.c[2]}"/><polygon points="180,80 335,150 180,220 25,150" fill="#f6efdc" stroke="#e4d8b8"/><g transform="translate(180 20) skewY(24.3)"><rect x="30" y="14" width="110" height="38" rx="4" fill="#fff"/><text x="85" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="#17323a">${R.b}</text></g><g transform="translate(25 90) skewY(-24.3)"><rect x="40" y="2" width="30" height="26" rx="3" fill="#bfe3ff"/><rect x="85" y="2" width="30" height="26" rx="3" fill="#bfe3ff"/></g>${R.n.map((k,i)=>{const[x,y]=SPOTS[i],c=PC[k];return `<g transform="translate(${x} ${y})"><g class="bob">${person(c[0],c[1],c[2])}</g><text y="13" text-anchor="middle" font-size="9" fill="#17323a">${k}</text></g>`}).join('')}<g transform="translate(180 196)"><g class="bob">${person(a.c,a.sk,a.hr)}</g><text y="13" text-anchor="middle" font-size="9" font-weight="700" fill="#17323a">${esc((S.name||'You').slice(0,10))} (you)</text></g></svg>`}
const act=p=>{if(p.off===undefined)return{cl:p.cl,sk:p.sk};const V=TASKS.filter(t=>!t.sc),k=V.filter(t=>S.done[t.id]).length,t=V[Math.max(0,Math.min(V.length-1,k+p.off))];return{cl:'Virtual Office',sk:t.skill+' ('+t.title+')'}};
const bar=()=>{const a=AV(),on=DB.cur;return `<div class="card" style="display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:0"><svg viewBox="-12 -30 24 36" width="28" height="42" aria-hidden="true">${person(a.c,a.sk,a.hr)}</svg><div style="flex:1;min-width:0"><b>${on?esc(S.name):'Guest'}</b><br><small>${on?'Signed in on this device':'Progress is not saved'}</small></div><button class="btn alt" style="min-height:40px;padding:6px 14px" aria-expanded="${!!lg}" onclick="lg=!lg;render()">${on?'Account':'Sign in'}</button></div>${lg?loginPanel():''}`};
const loginPanel=()=>`<div class="card"><b>${DB.cur?'Your account':'Sign in or create a profile'}</b><p class="mute" style="font-size:.9rem">Profiles are stored only on this device. There is no password, so keep private information out. Real online accounts need a hosted backend.</p>${Object.keys(DB.p).map(id=>`<button class="row" onclick="sw('${id}')"><span class="ic">👤</span><span><b>${esc(DB.p[id].name||'Learner')}</b><small>${Object.keys(DB.p[id].done||{}).length} tasks done${id===DB.cur?' (current)':''}</small></span></button>`).join('')}<label for="ln"><b>New profile name</b></label><input id="ln" type="text" autocomplete="given-name"><div style="margin-top:10px"><button class="btn" onclick="mk()">Create and sign in</button>${DB.cur?' <button class="btn alt" onclick="out()">Sign out</button>':''}</div></div>`;
const SCHOOLS=[{n:'Remote Work Academy',i:'💼',lv:'Adults',d:'Career discovery and virtual assistant practice',live:1,go:'map'},{n:'School of Business and Operations',i:'📊',lv:'Adults',d:'Project coordination, bookkeeping and CRM',live:1,go:'biz'},{n:'School of Tech and AI',i:'🤖',lv:'Adults and teens',d:'AI tools, automation and no-code'},{n:'School of Creative Arts',i:'🎨',lv:'All ages',d:'Design, content and media'},{n:'Junior School',i:'🧒',lv:'Ages 8 to 15',d:'Digital skills and safe online habits'},{n:'Open University',i:'🏛️',lv:'Adults',d:'Degree-style pathways with partner institutions'}];

function tog(k){const i=S.disc.indexOf(k);i<0?S.disc.push(k):S.disc.splice(i,1);save();render()}
function career(){const sc=PATHS.map(p=>({...p,hit:p.t.filter(k=>S.disc.includes(k))})).filter(p=>p.hit.length).sort((a,b)=>b.hit.length-a.hit.length).slice(0,3);const lab=k=>SKILLS.find(s=>s[0]===k)[1].toLowerCase();
return `<h1>🧭 Career Discovery Centre</h1>${room('career')}<div class="card"><label for="nm"><b>Your first name</b></label><input id="nm" type="text" autocomplete="given-name" value="${esc(S.name)}" onchange="S.name=this.value.trim();save()"></div>
${avCard()}<div class="card"><b>Which of these have you done in school, work or life?</b><p class="mute">Pick all that apply.</p><div class="chips">${SKILLS.map(([k,l])=>`<label class="chip"><input type="checkbox" ${S.disc.includes(k)?'checked':''} onchange="tog('${k}')">${l}</label>`).join('')}</div></div>
<h2>Remote paths that may suit you</h2>${sc.length?sc.map(p=>`<div class="card"><b>${p.n}</b><p>${p.d}</p><small>Matches your experience in: ${p.hit.map(lab).join(', ')}</small></div>`).join('')+'<button class="btn" onclick="go(\'office\')">Try a virtual assistant simulation</button>':'<p class="mute">Select at least one item above to see ideas.</p>'}
<p class="note">These are ideas to explore, not predictions. Research each path before committing.</p>`}
function office(){return `<h1>💼 Virtual Office</h1><p>Work for Maya Okoro's bakery (fictional) as a virtual assistant. Complete the five tasks below.</p>${deskScene()}`+TASKS.filter(t=>!t.sc).map((t,i)=>{const d=S.done[t.id];return `<button class="row" onclick="go('${t.id}')"><span class="ic">${d?'✅':'📝'}</span><span><b>${i+1}. ${t.title}</b><small>${d?'Completed, '+d.score+'/'+d.total+' correct':'Skill: '+t.skill}</small></span></button>`}).join('')+`<p class="note">Completing tasks is practice only. It does not certify you or guarantee employment.</p>`}
function task(t){const A=T[t.id]=T[t.id]||{};let h=`<h2>${t.title}</h2><div class="card" style="display:flex;gap:12px"><svg viewBox="-12 -30 24 36" width="44" height="66" aria-hidden="true" style="flex:none">${person(t.id==='mailreply'?'#0ea5e9':'#f59e0b',t.id==='mailreply'?'#c68642':'#8d5a3b','#111')}</svg><div><small>${t.id==='mailreply'?'Jordan Bell, customer':'Maya Okoro, your client'}</small><br>${t.brief}</div></div>`;const R=A.res;
if(t.type==='sel')h+=`<div class="card">${t.items.map((it,i)=>`<div class="item"><label for="s${i}">${it.q}</label><select id="s${i}" onchange="T.${t.id}.v[${i}]=this.value" ${R?'disabled':''}><option value="">Choose...</option>${t.opts.map(o=>`<option ${A.v&&A.v[i]===o?'selected':''}>${o}</option>`).join('')}</select>${R?fb(R[i]):''}</div>`).join('')}</div>`,A.v=A.v||[];
if(t.type==='flag')h+=`<div class="card">${t.items.map((it,i)=>`<button class="line ${A.f&&A.f.includes(i)?'on':''}" aria-pressed="${!!(A.f&&A.f.includes(i))}" ${R?'disabled':''} onclick="flag('${t.id}',${i})">${it.q}</button>${R?fb(R[i]):''}`).join('')}</div>`,A.f=A.f||[];
if(t.type==='draft')h+=`<div class="card"><label for="dr"><b>Your reply</b></label><textarea id="dr" ${R?'disabled':''} oninput="T.${t.id}.txt=this.value">${esc(A.txt||'')}</textarea>${R?R.map(fb).join(''):''}</div>`;
if(R){const s=R.filter(r=>r.ok).length,p=s/R.length>=.7;h+=`<div class="card"><b class="${p?'ok':'bad'}">Score: ${s}/${R.length}. ${p?'Task complete and added to your portfolio.':'Review the feedback and try again.'}</b></div><button class="btn alt" onclick="T.${t.id}={};render()">Try again</button> <button class="btn" onclick="go('${t.sc?'biz':'office'}')">Back to tasks</button>`}
else h+=`<button class="btn" onclick="check('${t.id}')">Check my work</button>`;return h}
const fb=r=>`<div class="fb ${r.ok?'ok':'bad'}">${r.ok?'✔ ':'✖ '}${r.msg||''}</div>`;
function flag(id,i){const f=T[id].f,k=f.indexOf(i);k<0?f.push(i):f.splice(k,1);render()}
function check(id){const t=TASKS.find(x=>x.id===id),A=T[id];let R,work;
if(t.type==='sel'){if(t.items.some((_,i)=>!A.v[i])){alert('Please answer every item first.');return}R=t.items.map((it,i)=>({ok:it.ok.includes(A.v[i]),msg:(it.ok.includes(A.v[i])?'Correct. ':'You chose "'+A.v[i]+'". ')+it.why}));work=t.items.map((it,i)=>it.q.split(/[|:]/)[0]+' → '+A.v[i]).join('; ')}
if(t.type==='flag'){R=t.items.map((it,i)=>{const on=A.f.includes(i);return{ok:on===!!it.err,msg:(on===!!it.err?'Correct. ':on?'This line was fine. ':'You missed this one. ')+it.why}});work='Found '+R.filter((r,i)=>r.ok&&t.items[i].err).length+' of '+t.items.filter(i=>i.err).length+' schedule errors and explained each fix.'}
if(t.type==='draft'){const x=A.txt||'';if(!x.trim()){alert('Write your reply first.');return}R=DRAFT_CHECKS.map(([m,f])=>({ok:f(x),msg:m}));work=x}
A.res=R;const s=R.filter(r=>r.ok).length;if(s/R.length>=.7){const old=S.done[id];if(!old||s>=old.score)S.done[id]={score:s,total:R.length,work,date:new Date().toLocaleDateString()};save()}render();scrollTo(0,0)}
function progress(){const n=Object.keys(S.done).length;
return `<h1>🏆 Progress Centre</h1>${room('progress')}${meCard()}<p>${S.name?esc(S.name)+', you have':'You have'} completed ${n} of ${TASKS.length} tasks.</p><div class="card"><b>Skills practised</b>${TASKS.map(t=>{const d=S.done[t.id],p=d?Math.round(d.score/d.total*100):0;return `<div class="item"><div>${t.skill} <small>${d?p+'% on best attempt':'Not started'}</small></div><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
${S.disc.length?`<div class="card"><b>Your transferable skills</b><div class="chips" style="margin-top:8px">${S.disc.map(k=>`<span class="tag">${SKILLS.find(s=>s[0]===k)[1]}</span>`).join('')}</div></div>`:''}
<h2>Portfolio</h2>${n?TASKS.filter(t=>S.done[t.id]).map(t=>{const d=S.done[t.id];return `<div class="card"><b>${t.title}</b> <span class="tag">${d.date}</span><pre>${esc(d.work)}</pre></div>`}).join(''):'<p class="mute">Completed tasks appear here as sample work from a fictional client.</p>'}
<button class="btn alt" onclick="if(confirm('Erase all progress on this device?')){S={name:'',disc:[],done:{}};T={};save();go('map')}">Reset progress</button>
<p class="note">Progress is saved only in this browser. This is practice work, not a certificate or proof of job readiness.</p>`}
function soon(){const s=SPACES.find(x=>x.id===soonId);return `<h1>${s.icon} ${s.name}</h1>${room(s.id)}<div class="card"><span class="tag">Coming soon</span><p>${s.desc}. This district is still being built.</p></div><button class="btn" onclick="go('map')">Back to the map</button>`}
render();
</script></body></html>
